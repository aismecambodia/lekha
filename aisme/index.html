<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lekha AiSME</title>
<meta name="apple-mobile-web-app-title" content="Lekha AiSME">
<meta name="application-name" content="Lekha AiSME">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#3D2B8E">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">
<script>
  // Tenant app. One launcher folder per tenant; only this line and the names change.
  var TARGET = "https://aisme-os.softr.app/";
  var params = new URLSearchParams(location.search);
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (standalone) {
    // Opened from the home-screen icon.
    location.replace(TARGET);
  } else if (isIOS) {
    // iPhone re-loads the saved address to fetch the icon. Keep this page plain
    // (no ?go=1, no redirect) so it finds the Lekha icon; the icon then opens
    // in standalone mode, which redirects above.
    if (params.get("go") === "1") { history.replaceState(null, "", location.pathname); }
  } else if (params.get("go") === "1") {
    location.replace(TARGET);
  } else {
    // Android: put ?go=1 in the address so the shortcut opens the app directly.
    history.replaceState(null, "", location.pathname + "?go=1");
  }
</script>
<style>
  :root { --indigo:#3D2B8E; --ink:#1B1830; --mist:#F7F6FB; --muted:#5B5873; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--mist); color:var(--ink);
    font-family: Inter, -apple-system, "Segoe UI", Roboto, "Noto Sans Khmer", "Khmer OS Battambang", sans-serif;
    line-height:1.55; }
  main { max-width:440px; margin:0 auto; padding:40px 16px 48px; text-align:center; }
  img.logo { width:96px; height:96px; border-radius:22px; box-shadow:0 6px 20px rgba(61,43,142,.25); }
  h1 { font-size:24px; margin:18px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  a.open { display:block; background:var(--indigo); color:#fff; text-decoration:none;
    font-weight:700; padding:15px 18px; border-radius:12px; font-size:17px; }
  .card { background:#fff; border-radius:14px; padding:18px 18px 8px; margin-top:24px; text-align:left;
    box-shadow:0 1px 3px rgba(27,24,48,.08); }
  .card h2 { font-size:16px; margin:0 0 8px; }
  .card ol { padding-left:20px; margin:0 0 12px; }
  .card li { margin-bottom:6px; }
  b { color:var(--indigo); }
</style>
</head>
<body>
<main>
  <img class="logo" src="./icon-192.png" alt="Lekha">
  <h1>Lekha AiSME</h1>
  <p class="sub">លេខា AiSME · Marketing OS</p>
  <a class="open" href="https://aisme-os.softr.app/">Open Lekha · បើកលេខា</a>

  <div class="card">
    <h2>iPhone (Safari)</h2>
    <ol>
      <li>ចុចប៊ូតុង <b>Share</b> (ប្រអប់មានព្រួញឡើងលើ)</li>
      <li>ចុច <b>Add to Home Screen</b></li>
      <li>ចុច <b>Add</b></li>
    </ol>
  </div>
  <div class="card">
    <h2>Android (Chrome)</h2>
    <ol>
      <li>ចុច <b>⋮</b> ជ្រុងខាងលើស្តាំ</li>
      <li>ចុច <b>Add to Home screen</b> ឬ <b>Install app</b></li>
      <li>ចុច <b>Add</b></li>
    </ol>
  </div>
</main>
</body>
</html>
